name: Build and publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grocery_test
          POSTGRES_USER: grocery_test
          POSTGRES_PASSWORD: grocery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery_test -d grocery_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r apps/api/requirements-dev.txt
      - run: npm ci --prefix apps/api/picnic-search --ignore-scripts
      - run: python -m unittest discover -s tests -v
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://grocery_test:grocery_test@localhost:5432/grocery_test
      - run: node --test apps/api/picnic-search/search.test.mjs evaluations/test_picnic_node.cjs
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: scanner
            context: apps/scanner
            dockerfile: apps/scanner/Dockerfile

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grocery-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

name: grocery-hub-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grocery
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://grocery:grocery@postgres:5432/grocery
      REDIS_URL: redis://redis:6379/0
      SCANNER_DEVICE_TOKENS: dev:dev-token
      PICNIC_USERNAME: ${PICNIC_USERNAME:-}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD:-}
      PICNIC_COUNTRY_CODE: ${PICNIC_COUNTRY_CODE:-FR}
      CHRONODRIVE_EMAIL: ${CHRONODRIVE_EMAIL:-}
      CHRONODRIVE_USERNAME: ${CHRONODRIVE_USERNAME:-}
      CHRONODRIVE_PASSWORD: ${CHRONODRIVE_PASSWORD:-}
      CHRONODRIVE_STORE_ID: ${CHRONODRIVE_STORE_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://grocery:grocery@postgres:5432/grocery
      REDIS_URL: redis://redis:6379/0
      PICNIC_USERNAME: ${PICNIC_USERNAME:-}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD:-}
      PICNIC_COUNTRY_CODE: ${PICNIC_COUNTRY_CODE:-FR}
      CHRONODRIVE_EMAIL: ${CHRONODRIVE_EMAIL:-}
      CHRONODRIVE_USERNAME: ${CHRONODRIVE_USERNAME:-}
      CHRONODRIVE_PASSWORD: ${CHRONODRIVE_PASSWORD:-}
      CHRONODRIVE_STORE_ID: ${CHRONODRIVE_STORE_ID:-}
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_dev:
